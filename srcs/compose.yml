volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/iubieta-/data/wordpress
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/iubieta-/data/mariadb

services:
  nginx:
    image: iubieta-/nginx:1.0
    build: nginx/
    ports:
      - 443:443
    volumes:
      - wordpress:/var/www/html
    secrets:
      - site_crt
      - site_key

  mariadb:
    image: iubieta-/mariadb:1.0
    build: mariadb/
    ports:
      - 3306:3306
    volumes:
      - mariadb:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_pass
      - db_root_pass

  wordpress:
    image: iubieta-/wordpress:1.0
    build: wordpress/
    ports:
      - 9000:9000
    volumes:
      - wordpress:/var/www/html
    env_file:
      - .env
    secrets:
      - db_pass
      - wp_user_pass
      - wp_admin_pass

secrets:
  site_crt:
    file: ../secrets/site.crt
  site_key:
    file: ../secrets/site.key
  db_pass:
    file: ../secrets/db_password.txt
  db_root_pass:
    file: ../secrets/db_root_password.txt
  wp_user_pass:
    file: ../secrets/wp_user_password.txt
  wp_admin_pass:
    file: ../secrets/wp_admin_password.txt
